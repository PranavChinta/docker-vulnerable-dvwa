apiVersion: apps/v1
kind: Deployment
metadata: {name: dvwa-web}
spec:
  replicas: 3
  selector: {matchLabels: {app: dvwa-web}}
  template:
    metadata: {labels: {app: dvwa-web}}
    spec:
      containers:
      - name: web
        image: localhost:32000/dvwa-webapp:k8s
        env:
        - {name: DVWA_DB_SERVER, value: mysql-svc}
        - {name: DVWA_DB_NAME,   value: dvwa}
        - {name: DVWA_DB_USER,   value: app}
        - {name: DVWA_DB_PASS,   value: vulnerables}
        ports: [{containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata: {name: dvwa-web-svc}
spec:
  selector: {app: dvwa-web}
  type: NodePort
  ports: [{port: 80, targetPort: 80}]
