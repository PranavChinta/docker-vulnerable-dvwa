apiVersion: apps/v1
kind: Deployment
metadata: {name: dvwa-mysql}
spec:
  selector: {matchLabels: {app: dvwa-mysql}}
  template:
    metadata: {labels: {app: dvwa-mysql}}
    spec:
      containers:
      - name: mysql
        image: localhost:32000/dvwa-db:k8s
        env:
        - {name: MYSQL_ROOT_PASSWORD, value: vulnerables}
        - {name: MYSQL_DATABASE, value: dvwa}
        - {name: MYSQL_USER, value: app}
        - {name: MYSQL_PASSWORD, value: vulnerables}
        ports: [{containerPort: 3306}]
---
apiVersion: v1
kind: Service
metadata: {name: mysql-svc}
spec:
  selector: {app: dvwa-mysql}
  ports: [{port: 3306, targetPort: 3306}]
